schema: '2.0'
stages:
  clean_raw:
    cmd: python -m mlops.dataset --task clean --input 
      data/raw/work_absenteeism_modified.csv --output 
      data/interim/absenteeism_clean.parquet
    deps:
    - path: data/raw/work_absenteeism_modified.csv
      hash: md5
      md5: 96c318341d1846f567be7127f52d03e1
      size: 79517
    - path: mlops/dataset.py
      hash: md5
      md5: 3f96c26ad3522f71d17532440ca84e9c
      size: 7826
    - path: params.yaml
      hash: md5
      md5: de83a293102d80f66350dfd73049deb9
      size: 4206
    params:
      params.yaml:
        clean.drop_columns:
        - ID
        - mixed_type_col
        clean.outliers.method: iqr
        clean.outliers.z_thresh: 3.0
    outs:
    - path: data/interim/absenteeism_clean.parquet
      hash: md5
      md5: 94adc8c258881c1fc4c8eed6800da097
      size: 15636
  features:
    cmd: python -m mlops.features --task build --input 
      data/interim/absenteeism_clean.parquet --output 
      data/processed/absenteeism_features.parquet
    deps:
    - path: data/interim/absenteeism_clean.parquet
      hash: md5
      md5: 94adc8c258881c1fc4c8eed6800da097
      size: 15636
    - path: mlops/features.py
      hash: md5
      md5: d168d91a4017026560994a227443e395
      size: 5636
    - path: params.yaml
      hash: md5
      md5: de83a293102d80f66350dfd73049deb9
      size: 4206
    params:
      params.yaml:
        features.drop_low_variance: true
        features.encode: onehot
        features.scale: standard
        features.variance_thresh: 0.0
    outs:
    - path: data/processed/absenteeism_features.parquet
      hash: md5
      md5: 26a2d61e5ac4915a73f46f3db4f34af9
      size: 56670
  split:
    cmd: python -m mlops.dataset --task split --input 
      data/processed/absenteeism_features.parquet --train 
      data/processed/train.parquet --test data/processed/test.parquet
    deps:
    - path: data/processed/absenteeism_features.parquet
      hash: md5
      md5: 26a2d61e5ac4915a73f46f3db4f34af9
      size: 56670
    - path: mlops/dataset.py
      hash: md5
      md5: 3f96c26ad3522f71d17532440ca84e9c
      size: 7826
    - path: params.yaml
      hash: md5
      md5: de83a293102d80f66350dfd73049deb9
      size: 4206
    params:
      params.yaml:
        split.random_state: 42
        split.stratify: true
        split.test_size: 0.2
    outs:
    - path: data/processed/test.parquet
      hash: md5
      md5: 4a3b1fcdfb33a8523e1a4d85ee95478b
      size: 53598
    - path: data/processed/train.parquet
      hash: md5
      md5: c0152f27303334bd325dd78b76c23fef
      size: 57063
  train_model:
    cmd: python -m mlops.modeling.train --train data/processed/train.parquet 
      --test data/processed/test.parquet --model-out models/model.pkl 
      --metrics-out metrics.json
    deps:
    - path: data/processed/test.parquet
      hash: md5
      md5: 4a3b1fcdfb33a8523e1a4d85ee95478b
      size: 53598
    - path: data/processed/train.parquet
      hash: md5
      md5: c0152f27303334bd325dd78b76c23fef
      size: 57063
    - path: mlops/modeling/train.py
      hash: md5
      md5: bc0f8d9a824a47ae8e16eea02f38e78c
      size: 5532
    - path: params.yaml
      hash: md5
      md5: de83a293102d80f66350dfd73049deb9
      size: 4206
    params:
      params.yaml:
        mlflow.experiment: absenteeism-baseline
        mlflow.tracking_uri: local
        model.alg: logreg
        model.params:
          max_iter: 1000
    outs:
    - path: metrics.json
      hash: md5
      md5: 43f5785ab7e86c60b8ace493af0e5804
      size: 107
    - path: models/model.pkl
      hash: md5
      md5: 5ad366bcc7507600ceb0ec8300855a39
      size: 3279
  evaluate:
    cmd: python -m mlops.modeling.evaluate --model models/model.pkl --test 
      data/processed/test.parquet --report reports/evaluation.json
    deps:
    - path: data/processed/test.parquet
      hash: md5
      md5: 4a3b1fcdfb33a8523e1a4d85ee95478b
      size: 53598
    - path: mlops/modeling/evaluate.py
      hash: md5
      md5: 9e789d7c92b51c7f2eb1464a937cca8f
      size: 3084
    - path: models/model.pkl
      hash: md5
      md5: 5ad366bcc7507600ceb0ec8300855a39
      size: 3279
    outs:
    - path: reports/evaluation.json
      hash: md5
      md5: ec1ddab1a08e37fa102789317797e6ae
      size: 834
  register_model:
    cmd: python -m mlops.modeling.register_model --model models/model.pkl 
      --metrics metrics.json
    deps:
    - path: metrics.json
      hash: md5
      md5: 43f5785ab7e86c60b8ace493af0e5804
      size: 107
    - path: mlops/modeling/register_model.py
      hash: md5
      md5: 24ab6179a91bae6c49b6c7017ef9a5f2
      size: 2686
    - path: models/model.pkl
      hash: md5
      md5: 5ad366bcc7507600ceb0ec8300855a39
      size: 3279
