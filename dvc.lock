      isexec: true
    - path: params.yaml
      hash: md5
      md5: de83a293102d80f66350dfd73049deb9
      size: 4206
      isexec: true
    params:
      params.yaml:
        split.random_state: 42
        split.stratify: true
        split.test_size: 0.2
    outs:
    - path: data/processed/test.parquet
      hash: md5
      md5: b896f41419f2f4c7cd4e702769521b1c
