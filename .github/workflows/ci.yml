name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[gdrive] black ruff pytest pytest-cov

      # Validar el pipeline de DVC (no baja datos)
      - name: Validate DVC graph
        run: |
          dvc --version
          dvc dag
          dvc status -q || true

      # Lint (sin formatear)
      - name: Lint (ruff + black --check)
        run: |
          ruff check .
          black --check .

      # Ejecutar pruebas unitarias con coverage
      - name: Run tests with coverage
        run: |
          pytest --cov=mlops --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60 -v

      # Publicar resumen de cobertura en el PR
      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          output: both
          thresholds: "60 80"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # (Opcional) subir el reporte HTML de cobertura como artefacto descargable
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report
          path: htmlcov/
